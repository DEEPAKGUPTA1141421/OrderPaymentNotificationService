spring.application.name=OrderPaymentNotificationService
server.port=${PORT:8082}

# ========= Database =========
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
feign.client.productclient.url=${PRODUCT_SERVICE_URL}
feign.client.deliveryclient.url=${DELIVERY_SERVICE_URL}
# ========= JPA =========
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ========= Redis =========
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT}
spring.data.redis.username=${REDIS_USERNAME}
spring.data.redis.password=${REDIS_PASSWORD}
spring.data.redis.ssl.enabled=${REDIS_SSL_ENABLED:true}
spring.data.redis.client-type=lettuce

# ========= Twilio =========
twilio.account.sid=${TWILIO_ACCOUNT_SID}
twilio.auth.token=${TWILIO_AUTH_TOKEN}
twilio.phone.number=${TWILIO_PHONE_NUMBER}

# ========= SendGrid =========
sendgrid.api.key=${SENDGRID_API_KEY}
sendgrid.from.email=${SENDGRID_FROM_EMAIL}

# ========= WhatsApp (Meta Cloud API) — used to send finalized invoices =========
# Set WHATSAPP_ENABLED=true once a Meta Business/WhatsApp Cloud API account is
# provisioned; until then, invoice "Send via WhatsApp" attempts fail with a
# clear reason and the invoice's delivery row is marked FAILED (not silently dropped).
whatsapp.enabled=${WHATSAPP_ENABLED:false}
whatsapp.phone-number-id=${WHATSAPP_PHONE_NUMBER_ID:}
whatsapp.access-token=${WHATSAPP_ACCESS_TOKEN:}
whatsapp.api.base-url=${WHATSAPP_API_BASE_URL:https://graph.facebook.com/v19.0}

# ========= Messaging =========
# "kafka" or "redis". Redis pub/sub is a stand-in for local/free hosting
# where a Kafka broker isn't available; switch back to "kafka" once a VM
# with a real broker is provisioned. Must match ProductClientService's
# app.messaging.provider — the "notification.events" / "orders.events" /
# etc. topics are shared across both services.
app.messaging.provider=${MESSAGING_PROVIDER:kafka}

# ========= Kafka =========
# Broker address is configured in application.yml (spring.kafka.bootstrap-servers)

# ========= Google API =========
google.api.key=${GOOGLE_API_KEY}

# ========= Elasticsearch =========
elasticsearch.url=${ELASTICSEARCH_URL}

# ========= JWT =========
# Always the same bundled key pair as ProductClientService (the service that
# actually issues seller/user tokens at login) — this service only verifies
# tokens, never issues its own, so it must hold the matching public key.
# No env var override here on purpose: a JWT_PUBLIC_KEY that drifts from
# ProductClientService's key is exactly what caused every request here to
# 401 after a successful login (validateToken() can't tell a signature
# mismatch apart from an expired/malformed token — it just returns false).
jwt.private.key.path=classpath:keys/private_key.pem
jwt.public.key.path=classpath:keys/public_key.pem
jwt.expiration.in.millis=86400000


# ========= AWS S3 =========
aws.access.key=${AWS_ACCESS_KEY}
aws.secret.key=${AWS_SECRET_KEY}
aws.region=${AWS_REGION}
aws.s3.bucket=${AWS_S3_BUCKET}

# ========= Cloudinary =========
cloudinary.cloud.name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api.key=${CLOUDINARY_API_KEY}
cloudinary.api.secret=${CLOUDINARY_API_SECRET}

# ========= Others =========
spring.cloud.compatibility-verifier.enabled=false
server.error.include-stacktrace=never
server.error.include-message=never


# ========= Internal Service Auth =========
# Must match the INTERNAL_API_KEY env-var on the cart/product servicce
internal.api.key=${INTERNAL_API_KEY:internal-api}
# Client credentials for the cart internal endpoint — must match
# internal.client.id / internal.client.secret on the product/cart service.
internal.client.id=${INTERNAL_CLIENT_ID:order-payment-notification-service}
internal.client.secret=${INTERNAL_CLIENT_SECRET:secret123}

# ========= phone pe gateway =======
# Checkout page URL prefix — append ?token={token} to build the payment URL
phonepe.checkout.base.url=${PHONEPE_CHECKOUT_BASE_URL}
phonepe.clientId=${PHONEPE_CLIENT_ID}
phonepe.clientSecret=${PHONEPE_CLIENT_SECRET}
phonepe.clientVersion=${PHONEPE_CLIENT_VERSION}
payment.webhook.secret=${PHONE_PAY_WEBHOOK_SECRET}

# ========= razorpay gateway =======
razorpay.key.id=${RAZORPAY_KEY_ID}
razorpay.key.secret=${RAZORPAY_KEY_SECRET}
razorpay.webhook.secret=${RAZORPAY_WEBHOOK_SECRET}

# ─── Add these to your existing application.properties / application.yml ──────
 
# ── FCM (Firebase Cloud Messaging) ────────────────────────────────────────────
# Set to true only once credentials are supplied via ONE of:
#   (a) env vars FIREBASE_PROJECT_ID / FIREBASE_CLIENT_EMAIL / FIREBASE_PRIVATE_KEY
#       (preferred for staging/prod — nothing committed to the repo), or
#   (b) a local firebase-service-account.json at fcm.service-account-file
#       (local dev only — already .gitignore'd, never commit it)
fcm.enabled=${FCM_ENABLED:false}
fcm.service-account-file=classpath:firebase-service-account.json
 
# ── Kafka: notification events topic ──────────────────────────────────────────
# This topic is consumed by NotificationEventListener (cross-service events)
# Other microservices publish to this topic to trigger notifications
notification.events.topic=notification.events
 
# ── Notification dedup cache TTL (Redis) ──────────────────────────────────────
# Idempotency window for Kafka notification events (in hours)
notification.dedup.ttl.hours=24
 
# ── Async executor for NotificationDispatcher ─────────────────────────────────
spring.task.execution.pool.core-size=5
spring.task.execution.pool.max-size=20
spring.task.execution.pool.queue-capacity=500
spring.task.execution.thread-name-prefix=notif-async-
 
# ── Flyway (if you use Flyway for DB migrations) ──────────────────────────────
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true


# ========= SendBird Chat =========
# Wire SendBird credentials from .env (SENDBIRD_APPLICATION_ID, SENDBIRD_MASTER_API_TOKEN already set there)
sendbird.application-id=${SENDBIRD_APPLICATION_ID}
sendbird.master-api-token=${SENDBIRD_MASTER_API_TOKEN}
# Fixed support-agent user that is added to every support channel
sendbird.support-agent-id=${SENDBIRD_SUPPORT_AGENT_ID}
sendbird.support-agent-nickname=${SENDBIRD_SUPPORT_AGENT_NICKNAME}
# Session token TTL in seconds (default 7 days)
sendbird.session-token-expires-in-seconds=604800
# Webhook signature secret — set SENDBIRD_WEBHOOK_SECRET in .env (copy from SendBird dashboard → Settings → Webhooks)
sendbird.webhook-secret=${SENDBIRD_WEBHOOK_SECRET:}
# Days before a delivered order's customer-seller channel is archived
sendbird.channel.archive-delay-days=7
# How often (ms) the archival scheduler checks for due channels (default 1 hour)
sendbird.channel.archival-check-interval-ms=3600000

# ========= Chat Kafka Topics =========
# Outbound — consumed by notification service to send FCM push to offline users
chat.message.received.topic=chat.message.received
# Inbound lifecycle topics (set to match whatever your order service publishes)
chat.lifecycle.order-placed.topic=orders.events
chat.lifecycle.rider-assigned.topic=rider.assigned.events
chat.lifecycle.order-delivered.topic=order.delivered.